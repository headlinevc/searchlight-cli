version: 2

project_name: searchlight

before:
  hooks:
    - go mod tidy

builds:
  - id: searchlight
    main: ./
    binary: searchlight
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.buildDate={{.Date}}
      - -X github.com/headlinevc/searchlight-cli/internal/config.prodClientID={{.Env.SEARCHLIGHT_PROD_CLIENT_ID}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - name: searchlight
    repository:
      owner: headlinevc
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/headlinevc/searchlight-cli
    description: "Searchlight CLI — a thin client over the Searchlight MCP server"
    license: Proprietary
    test: |
      system "#{bin}/searchlight", "version"
    install: |
      bin.install "searchlight"

release:
  github:
    owner: headlinevc
    name: searchlight-cli
  prerelease: auto
  draft: false
